# Auto-merge routine Dependabot version updates after required checks pass.
#
# - Grouped patch + minor version bumps: auto-approved + auto-merged
# - Major bumps: labeled 'needs-review', no auto-merge
# - Security updates: labeled 'security', no auto-merge
#
# Requires: 'dependencies' and 'automated' labels exist on the repo
name: Auto-merge Dependencies

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  classify-and-merge:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    # gh resolves the target repo from GH_REPO when no git checkout is present,
    # so these commands don't need actions/checkout.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Fetch Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@v3

      - name: Label major version bumps for review
        if: ${{ steps.dependabot-metadata.outputs.update-type == 'version-update:semver-major' }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} \
            --add-label "needs-review" \
            --remove-label "automated" 2>/dev/null || true

      - name: Label security updates
        if: ${{ steps.dependabot-metadata.outputs.dependency-group == 'security-updates' }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} \
            --add-label "security" \
            --remove-label "automated" 2>/dev/null || true

      - name: Approve and auto-merge routine updates
        if: ${{ steps.dependabot-metadata.outputs.dependency-group == 'routine-updates' && steps.dependabot-metadata.outputs.update-type != 'version-update:semver-major' }}
        run: |
          gh pr review --approve ${{ github.event.pull_request.number }}
          gh pr merge --auto --squash ${{ github.event.pull_request.number }}
